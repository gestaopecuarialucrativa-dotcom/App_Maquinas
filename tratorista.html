<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPL · Fechar serviço</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,Arial,sans-serif;background:#f3f6f2;color:#16261a;max-width:520px;margin:0 auto}
.top{background:linear-gradient(140deg,#123d1d,#1f6b33 70%,#3f8f3a);color:#fff;padding:22px 18px 50px}.top small{color:#b9dcbf;font-size:11px;font-weight:600;letter-spacing:.6px}.top h1{font-size:22px;margin-top:4px}
.card{background:#fff;margin:-34px 14px 0;border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);position:relative}
.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #e6ebe5;font-size:14px}.row:first-child{border-top:none}.row span{color:#7a8a7e}
label{display:block;font-size:14px;font-weight:800;color:#1f6b33;margin:18px 0 6px}
input{width:100%;padding:14px;border:2px solid #1f6b33;border-radius:14px;font:700 24px Inter,Arial}
.calc{color:#1f6b33;font-weight:800;margin-top:10px;font-size:15px;min-height:20px}
.btn{display:block;width:calc(100% - 28px);margin:16px 14px;background:#1f6b33;color:#fff;border:none;border-radius:16px;padding:16px;font:800 16px Inter,Arial;cursor:pointer}
.btn:disabled{opacity:.6}.msg{text-align:center;padding:30px 20px;font-size:15px;color:#555}
</style></head><body>
<div class="top"><small>GPL · FAZENDA ESTRELA</small><h1>Fechar serviço de trator</h1></div>
<div class="card" id="box"><div class="msg">Carregando…</div></div>
<div id="acao"></div>
<script>
var API='https://script.google.com/macros/s/AKfycbyp-gXRxkQuP4atEVBlz4SsLbmrrLcB2gfzBUHxnBG9YozQavqs4Jqg7ehAtB0OivXPzQ/exec';
var TK=new URLSearchParams(location.search).get('t')||'', S=null;
function $(i){return document.getElementById(i);}
function n(v){var x=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(x)?0:x;}
function f1(v){return n(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
function dBR(s){s=String(s||'');return s.length>=10?s.substring(8,10)+'/'+s.substring(5,7)+'/'+s.substring(0,4):s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function api(acao,q,data,cb){ var nm='_cb'+Date.now(), s=document.createElement('script'), ok=false;
  window[nm]=function(r){ok=true;delete window[nm];s.remove();cb(r||{});};
  s.onerror=function(){if(ok)return;delete window[nm];s.remove();cb({ok:false,erro:'Sem internet. Tente de novo quando tiver sinal.'});};
  s.src=API+'?acao='+acao+q+'&data='+encodeURIComponent(JSON.stringify(data||{}))+'&callback='+nm+'&t='+Date.now(); document.body.appendChild(s); }
function msg(t){ $('box').innerHTML='<div class="msg">'+t+'</div>'; $('acao').innerHTML=''; }
if(!TK) msg('Link incompleto. Peça o link de novo ao consultor.');
else api('ver_servico','&token='+encodeURIComponent(TK),{},function(r){
  if(!r.ok){ msg(esc(r.erro||'Não consegui abrir o serviço.')); return; }
  S=r.servico;
  var linhas='<div class="row"><span>Pasto</span><b>'+esc(S.Area)+(S.Area_ha?' · '+f1(S.Area_ha)+' ha':'')+'</b></div><div class="row"><span>Serviço</span><b>'+esc(S.Servico)+'</b></div>'
   +'<div class="row"><span>Trator</span><b>'+esc(S.Trator)+'</b></div><div class="row"><span>Aberto em</span><b>'+dBR(S.Data)+'</b></div><div class="row"><span>Horímetro inicial</span><b>'+f1(S.Horimetro_Inicial)+'</b></div>';
  if(S.Status==='fechado'){ $('box').innerHTML=linhas+'<div class="row"><span>Horímetro final</span><b>'+f1(S.Horimetro_Final)+'</b></div><div class="calc">Serviço já fechado. Obrigado!</div>'; return; }
  $('box').innerHTML=linhas+'<label>Horímetro final</label><input id="hf" type="number" step="0.1" inputmode="decimal" oninput="calc()" placeholder="0,0"><div class="calc" id="calc"></div>';
  $('acao').innerHTML='<button class="btn" id="bt" onclick="fechar()">Fechar serviço</button>';
});
function calc(){ var h=n($('hf').value)-n(S.Horimetro_Inicial); $('calc').textContent=h>0?('= '+f1(h)+' h trabalhadas'):($('hf').value?'O final precisa ser maior que o inicial':''); }
function fechar(){ var hf=n($('hf').value), hi=n(S.Horimetro_Inicial);
  if(!(hf>hi)){ alert('O horímetro final precisa ser maior que o inicial ('+f1(hi)+').'); return; }
  if(!confirm('Confirmar horímetro final '+f1(hf)+' ('+f1(hf-hi)+' h)?')) return;
  var b=$('bt'); b.disabled=true; b.textContent='Enviando…';
  api('fechar_servico','',{token:TK,hor_fim:hf},function(r){
    if(!r.ok){ b.disabled=false; b.textContent='Fechar serviço'; alert(r.erro||'Não consegui enviar.'); return; }
    msg('<b style="color:#1f6b33;font-size:18px">Serviço fechado!</b><br><br>'+f1(r.horas)+' h registradas. Pode fechar esta página.'); });
}
</script></body></html>
